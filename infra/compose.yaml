name: tiesheai-clearml

x-clearml: &clearml
  image: clearml/server:2.4.0@sha256:5ec4aed2e40c619da63198c22e765a00b4e3e5c06081a9c0a4ae237df66fb7bb
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"

services:
  mongo:
    image: mongo:8.0.15@sha256:f4d54619262ae3bc6a0a8efbebcef970b87b8ad70697479a75ce308a6f400158
    restart: unless-stopped
    command: ["--setParameter", "internalQueryMaxBlockingSortMemoryUsageBytes=196100200"]
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "if (db.adminCommand({ping: 1}).ok !== 1) quit(1)"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  redis:
    image: redis:8.2.3@sha256:0908d9af26bf9b985e984a40a5eb82eed229b07a3317eee6843832c3cc3a9619
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  elasticsearch:
    image: elasticsearch:8.19.9@sha256:dee84085936b5b5fc3a6d322ff7545c939f99269b2d94bf19ea4af968893bbc4
    restart: unless-stopped
    environment:
      bootstrap.memory_lock: "true"
      cluster.name: clearml
      cluster.routing.allocation.node_initial_primaries_recoveries: "500"
      cluster.routing.allocation.disk.watermark.low: 500mb
      cluster.routing.allocation.disk.watermark.high: 500mb
      cluster.routing.allocation.disk.watermark.flood_stage: 500mb
      discovery.type: single-node
      http.compression_level: "7"
      node.name: clearml
      reindex.remote.whitelist: "'*.*'"
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms${ELASTIC_HEAP_SIZE:-1g} -Xmx${ELASTIC_HEAP_SIZE:-1g}"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
      - elastic-logs:/usr/share/elasticsearch/logs
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' | grep -Eq '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 45s

  fileserver:
    <<: *clearml
    command: [fileserver]
    # AuthHandler creates an API session before the HTTP listener starts.
    depends_on:
      apiserver:
        condition: service_healthy
    environment:
      CLEARML__fileserver__delete__allow_batch: "true"
    ports:
      - "${CLEARML_BIND_HOST:-127.0.0.1}:${CLEARML_FILES_PORT:-8081}:8081"
    volumes:
      - ./.local/clearml/config:/opt/clearml/config:ro
      - clearml-logs:/var/log/clearml
      - fileserver-data:/mnt/fileserver
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8081/', timeout=5).read().strip() == b'OK'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  apiserver:
    <<: *clearml
    command: [apiserver]
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      CLEARML_ELASTIC_SERVICE_HOST: elasticsearch
      CLEARML_ELASTIC_SERVICE_PORT: "9200"
      CLEARML_MONGODB_SERVICE_HOST: mongo
      CLEARML_MONGODB_SERVICE_PORT: "27017"
      CLEARML_REDIS_SERVICE_HOST: redis
      CLEARML_REDIS_SERVICE_PORT: "6379"
      CLEARML_SERVER_DEPLOYMENT_TYPE: linux
      CLEARML__apiserver__pre_populate__enabled: "false"
      # No async-delete worker or Agent is deployed in T01-A.
      CLEARML__services__async_urls_delete__enabled: "false"
    ports:
      - "${CLEARML_BIND_HOST:-127.0.0.1}:${CLEARML_API_PORT:-8008}:8008"
    volumes:
      - ./.local/clearml/config:/opt/clearml/config:ro
      - clearml-logs:/var/log/clearml
      - fileserver-data:/mnt/fileserver
    healthcheck:
      test: ["CMD", "python3", "-c", "import json, urllib.request; d = json.load(urllib.request.urlopen('http://127.0.0.1:8008/debug.ping', timeout=5)); assert d['meta']['result_code'] == 200 and d['data']['msg'] == 'ClearML server'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s

  webserver:
    <<: *clearml
    command: [webserver]
    depends_on:
      apiserver:
        condition: service_healthy
    ports:
      - "${CLEARML_BIND_HOST:-127.0.0.1}:${CLEARML_WEB_PORT:-8080}:80"
    volumes:
      - ./.local/clearml/config:/opt/clearml/config:ro
      - ./.local/clearml/web:/mnt/external_files/configs:ro
      - clearml-logs:/var/log/clearml
      - web-logs:/var/log/nginx
      - ./nginx.conf.template:/etc/nginx/clearml.conf.template:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; r = urllib.request.urlopen('http://127.0.0.1/', timeout=5); assert r.status == 200 and b'<html' in r.read().lower()"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

volumes:
  mongo-data:
  mongo-config:
  redis-data:
  elastic-data:
  elastic-logs:
  fileserver-data:
  clearml-logs:
  web-logs:
