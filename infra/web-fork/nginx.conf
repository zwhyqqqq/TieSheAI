worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    log_format fork '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
    access_log /dev/stdout fork;
    map $request_uri $api_uri { ~^/api(/.*)$ $1; default /; }
    map $request_uri $files_uri { ~^/files(/.*)$ $1; default /; }
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 8080;
        server_name _;
        root /srv/web;
        absolute_redirect off;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
        add_header X-TieSheAI-Web "web-fork" always;
        client_max_body_size 0;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        # Set-Cookie is forwarded by nginx; no cookie domain/path rewriting.
        location = /api { return 308 /api/; }
        location = /files { return 308 /files/; }
        location ^~ /api/ {
            set $api_backend apiserver:8008;
            proxy_pass http://$api_backend$api_uri;
        }
        location ^~ /files/ {
            set $files_backend fileserver:8081;
            proxy_pass http://$files_backend$files_uri;
        }
        location = /widgets { return 308 /widgets/$is_args$args; }
        location ~* \.map$ { return 404; }
        # Assets never fall back to HTML, including paths without an extension.
        location /app/ { try_files $uri =404; }
        location /assets/ { try_files $uri =404; }
        location /media/ { try_files $uri =404; }
        location /widgets/app/ { try_files $uri =404; }
        location /widgets/assets/ { try_files $uri =404; }
        location /widgets/media/ { try_files $uri =404; }
        location ~* \.(?:js|mjs|css|json|woff2?|ttf|otf|eot|png|jpe?g|svg|gif|ico|webp|wasm|txt|html)$ {
            try_files $uri =404;
        }
        location /widgets/ { try_files $uri $uri/ /widgets/index.html; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
